[package]
name = "tantivy_ex"
version = "0.1.0"
edition = "2021"

[lib]
name = "tantivy_ex"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
tantivy = "0.26"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
