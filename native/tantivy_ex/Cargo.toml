[package]
name = "tantivy_ex"
version = "0.6.0"
edition = "2024"
# rustler requires Rust 1.91
rust-version = "1.91"

[lib]
name = "tantivy_ex"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
tantivy = "0.27"
serde_json = "1.0"
base64 = "0.23"
time = { version = "0.3", features = ["parsing"] }
